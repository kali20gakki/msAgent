name: PR-pipeline_msagent

on:
  # PR 流水线通过 PR 评论 /compile 触发 ，不在 PR 打开/更新时自动运行
  pull_request:
    types: [open, update]
    branches: [ 'master' ]
    paths:
      - ".gitcode/**"
  pr_comment:
    types: [created]
    keyword: '^compile$'
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^compile$' ]

env:
  org_name: Ascend
  REPO_NAME: msagent
  REMOTE_URL: ${{ atomgit.repositoryurl }}
  PR_ID: ${{ atomgit.event.pull_request.number }}

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write
  action: read

stages:
  stage_0:
    name: CodeCheck
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build: ${{ steps.set-skip.outputs.need_build }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.PR_ID }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.PR_ID }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.jpeg'
                  - '!**/*.gif'
                  - '!**/*.webp'
                  - '!**/*.svg'
                  - '!**/*.puml'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.xlsx'
                  - '!**/LICENSE'
                  - '!docs/**/*.js'
                  - '!docs/**/*.css'
                  - '!docs/**/*.yaml'
                  - '!docs/**/*.txt'
                  - '!example/**/*.sh'
                  - '!example/**/*.txt'
                  - '!example/**/*.asc'

          - name: set build skip flag
            id: set-skip
            env:
              CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
              NON_DOC: ${{ steps.filter.outputs.non-doc }}
            run: |
              echo "changed: $CHANGED_FILES"
              echo "non-doc: $NON_DOC"
              if [ "$NON_DOC" = "true" ]; then
                echo "need_build=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build=no" >> "$ATOMGIT_OUTPUT"
              fi
              printf '%s' "$CHANGED_FILES" | tr -d '[]" ' | tr ',' '\n' | sed '/^$/d' > modify_files.txt
              cat modify_files.txt

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ env.REPO_NAME }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage_1:
    name: CodeCheck_Build_Test
    select: selected_by_default
    jobs:
      pre-commit:
        name: pre-commit
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
          options: --user root
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || '' }}
          - name: gitleaks install
            run: |
              wget -q --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cp gitleaks /usr/local/bin/
              gitleaks version
          - name: setup-python311
            run: |
              ln -sf /usr/local/bin/python3.11 /usr/bin/python
              python --version
          - name: run pre-commit
            uses: openlibing/pre-commit-action@v1.0.3
            env:
              SKIP: clang-tidy

      SCA:
        name: SCA
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
          options: --user root
        steps:
          - name: checkout
            uses: checkout
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: MindStudio

      malicious-scan:
        name: antipoison
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
          options: --user root
        steps:
          - name: Checkout
            uses: checkout
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: MindStudio

  stage_2:
    name: build
    select: selected_by_default
    jobs:
      Build_msagent_x86:
        name: Build_msagent_x86
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.build_mindstudio_job.yml
        with:
          IMAGE_FLAG: "mindstudio-build:26.1.0"
          runs_on_arch: "x86"
          ARTIFACT_NAME: "msagent-run-x86-test"

      Build_msagent_arm:
        name: Build_msagent_arm
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.build_mindstudio_job.yml
        with:
          IMAGE_FLAG: "mindstudio-build:26.1.0"
          runs_on_arch: "arm"
          ARTIFACT_NAME: "msagent-run-arm-test"

  stage_3:
    name: UT
    select: selected_by_default
    jobs:
      UT_msagent:
        name: UT_msagent
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.ut_mindstudio_job.yml
        with:
          IMAGE_FLAG: "mindstudio-build:26.1.0"
          runs_on_arch: "x86"

  stage_4:
    name: WHL_Validation
    select: selected_by_default
    jobs:
      WHL_validator_linux_conda:
        name: WHL_validator_linux_conda
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.whl_validator_job.yml
        with:
          installer: conda
          ARTIFACT_NAME: msagent-run-x86-test

      WHL_validator_linux_uv:
        name: WHL_validator_linux_uv
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.whl_validator_job.yml
        with:
          installer: uv
          ARTIFACT_NAME: msagent-run-x86-test

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ env.REPO_NAME }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ atomgit.event.pull_request.number }}
            apply_label: 'true'
